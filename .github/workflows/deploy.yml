name: 🚀 Deploy to gocalang.my.id

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ────────────────────────────────────────────────────────────
      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install ────────────────────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: npm ci

      # ── 4. Build ──────────────────────────────────────────────────────────────
      - name: 🏗️ Build production
        run: npm run build
        env:
          NODE_ENV: production

      # ── 5. Deploy via FTPS ────────────────────────────────────────────────────
      # Fix: ECONNRESET → use ftps (FTP over TLS) instead of plain ftp
      # AwanData cPanel requires encrypted connection on port 21 with TLS
      - name: 🚀 Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps          # ← was "ftp", ECONNRESET fix
          security: loose         # accept self-signed TLS cert (common on shared hosting)
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          log-level: verbose      # show detailed logs for debugging
          timeout: 60000          # 60s timeout per operation
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # ── 6. Done ───────────────────────────────────────────────────────────────
      - name: ✅ Deploy complete
        run: |
          echo "✅ Deployed to https://gocalang.my.id"
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo "Time   : $(date)"
